<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bếp của Zunxinh</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f5f5f5;--card:#fff;--tx:#222;--mu:#757575;--pr:#ee4d2d;--bd:#eee;--soft:#fff4f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151515;--card:#222;--tx:#f0f0f0;--mu:#a0a0a0;--bd:#333;--soft:#3a2420}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
header{background:linear-gradient(#f53d2d,#f63);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 12px}
.bar{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center}
.logo{font-weight:700;font-size:18px;white-space:nowrap}
.search{flex:1;display:flex;background:#fff;border-radius:3px;padding:3px}
.search input{flex:1;border:0;padding:8px;font-size:14px;outline:0;min-width:0;color:#222;background:transparent}
.search button{background:var(--pr);color:#fff;border:0;border-radius:2px;padding:0 14px;cursor:pointer}
.btn{background:#fff;color:var(--pr);border:0;border-radius:3px;padding:8px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
main{max-width:1100px;margin:auto;padding:12px}
.hero{background:linear-gradient(120deg,#ffb347,#ee4d2d);color:#fff;border-radius:4px;padding:22px;margin-bottom:12px}
.hero h1{margin:0 0 6px;font-size:22px}.hero p{margin:0;opacity:.95}
.sec{background:var(--card);border-radius:4px;margin-bottom:12px;padding:12px}
.sec h2{margin:0 0 10px;font-size:15px;color:var(--pr);text-transform:uppercase}
.cats{display:flex;gap:8px;overflow-x:auto}
.cat{flex:0 0 auto;text-align:center;border:1px solid var(--bd);border-radius:4px;padding:8px 14px;cursor:pointer;background:var(--card);color:var(--tx)}
.cat.on{border-color:var(--pr);color:var(--pr);background:var(--soft)}
.cat span{display:block;font-size:24px}
.sort{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sort button{border:0;background:var(--card);color:var(--tx);padding:7px 14px;border-radius:3px;cursor:pointer}
.sort button.on{background:var(--pr);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{background:var(--card);border:1px solid transparent;border-radius:3px;overflow:hidden;cursor:pointer}
.card:hover{border-color:var(--pr);transform:translateY(-1px)}
.img{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:64px;background-size:cover;background-position:center;position:relative}
.tag{position:absolute;top:0;right:0;background:#ffd424;color:var(--pr);font-size:11px;padding:2px 6px}
.cb{padding:8px}.cb .n{height:36px;overflow:hidden;line-height:18px}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-top:6px}
.star{color:#ffb400}.pr{color:var(--pr)}
.empty{text-align:center;color:var(--mu);padding:30px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;overflow:auto;padding:12px}
.mask.on{display:block}
.modal{background:var(--card);max-width:720px;margin:20px auto;border-radius:6px;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}
.mh h3{margin:0}.x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--tx)}
.mb{padding:16px}
.mb h4{margin:16px 0 6px;color:var(--pr)}
.mb ul,.mb ol{margin:0;padding-left:20px;line-height:1.7}
.note{background:var(--soft);border-left:3px solid var(--pr);padding:8px 12px;border-radius:2px;margin:4px 0}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:3px;font:inherit;background:var(--card);color:var(--tx);margin:4px 0 10px}
.go{background:var(--pr);color:#fff;border:0;padding:10px 18px;border-radius:3px;cursor:pointer;font-weight:600}
.stars span{font-size:26px;cursor:pointer;color:#ccc}.stars span.on{color:#ffb400}
.rv{border-top:1px solid var(--bd);padding:8px 0}
.rv small{color:var(--mu)}
footer{text-align:center;color:var(--mu);padding:20px}
</style>
</head>
<body>
<header><div class="bar">
<div class="logo">🍳 Bếp Zunxinh</div>
<div class="search"><input id="q" placeholder="Tìm món ăn, nguyên liệu, cách làm..."><button onclick="draw()">Tìm</button></div>
<button class="btn" onclick="openAdd()">+ Đăng món</button>
</div></header>
<main>
<div class="hero"><h1>Chào mừng đến bếp của Zunxinh 💕</h1><p>Công thức nấu ăn, cách chế biến và mẹo nhỏ mỗi ngày. Bấm vào món để xem chi tiết và để lại đánh giá nhé!</p></div>
<div class="sec"><h2>Danh mục</h2><div class="cats" id="cats"></div></div>
<div class="sort">
<button data-s="new" class="on">Mới nhất</button><button data-s="rate">Đánh giá cao</button><button data-s="cook">Nhiều người nấu</button><button data-s="time">Nấu nhanh</button>
</div>
<div class="grid" id="grid"></div>
</main>
<footer>© Bếp của Zunxinh · Nấu bằng cả trái tim ❤️</footer>

<div class="mask" id="m1"><div class="modal"><div class="mh"><h3 id="dt"></h3><button class="x" onclick="closeM()">×</button></div><div class="mb" id="db"></div></div></div>
<div class="mask" id="m2"><div class="modal"><div class="mh"><h3>Đăng món mới</h3><button class="x" onclick="closeM()">×</button></div><div class="mb">
<label>Tên món</label><input id="f_n">
<label>Danh mục</label><select id="f_c"></select>
<label>Thời gian nấu (phút)</label><input id="f_t" type="number" value="30">
<label>Hình ảnh món ăn</label><input id="f_i" type="file" accept="image/*">
<label>Nguyên liệu (mỗi dòng một món)</label><textarea id="f_g" rows="4"></textarea>
<label>Các bước làm (mỗi dòng một bước)</label><textarea id="f_s" rows="4"></textarea>
<label>Lưu ý khi nấu</label><textarea id="f_o" rows="2"></textarea>
<button class="go" onclick="addRecipe()">Đăng món</button></div></div></div>

<script>
var CATS=[["🍽️","Tất cả"],["🍲","Món canh"],["🍖","Món mặn"],["🥗","Món chay"],["🍰","Bánh ngọt"],["🥤","Đồ uống"]];
var R=[
{id:1,n:"Canh chua cá lóc",c:"Món canh",e:"🍲",bg:"#ffd9a8",t:35,lv:"Dễ",r:4.8,k:128,hot:1,
g:["500g cá lóc","2 quả cà chua","100g dứa","Đậu bắp, giá đỗ","Me, bạc hà, rau om, ngò gai"],
s:["Cá làm sạch, ướp chút muối tiêu 10 phút.","Phi tỏi, xào cà chua và dứa cho thơm.","Cho nước me vào nấu sôi rồi thả cá.","Cho đậu bắp, bạc hà, nêm vừa ăn.","Tắt bếp, thêm rau om, ngò gai và giá."],
o:"Không khuấy mạnh khi nấu cá để cá không bị nát. Nêm nếm chua ngọt sau cùng."},
{id:2,n:"Thịt kho trứng",c:"Món mặn",e:"🍖",bg:"#e8b98a",t:60,lv:"Trung bình",r:4.9,k:256,hot:1,
g:["600g thịt ba chỉ","6 quả trứng","2 thìa đường","Nước dừa tươi","Nước mắm, tiêu, hành tím"],
s:["Thịt cắt khối, trần sơ với nước sôi.","Thắng đường lên màu cánh gián.","Cho thịt vào xào săn, thêm nước mắm, hành.","Đổ nước dừa ngập thịt, hầm lửa nhỏ 40 phút.","Thả trứng luộc vào, kho thêm 15 phút."],
o:"Thắng đường đến màu cánh gián thì dừng, để quá lửa sẽ bị đắng."},
{id:3,n:"Đậu hũ sốt cà chua",c:"Món chay",e:"🥗",bg:"#c9e8b4",t:20,lv:"Dễ",r:4.6,k:94,
g:["3 bìa đậu hũ","3 quả cà chua","Hành lá","Nước tương, đường"],
s:["Đậu hũ cắt miếng, chiên vàng hai mặt.","Xào cà chua nhuyễn với chút đường.","Cho đậu vào, nêm nước tương, đun 5 phút.","Rắc hành lá, tắt bếp."],
o:"Thấm khô đậu hũ trước khi chiên để không bị bắn dầu."},
{id:4,n:"Bánh flan caramen",c:"Bánh ngọt",e:"🍮",bg:"#ffe39a",t:50,lv:"Trung bình",r:4.7,k:171,hot:1,
g:["5 quả trứng","500ml sữa tươi","80g đường","Vani","Đường làm caramen"],
s:["Nấu caramen đổ đáy khuôn.","Đánh trứng với đường, sữa, vani rồi lọc mịn.","Rót hỗn hợp vào khuôn, đậy kín.","Hấp lửa nhỏ 25 phút, để nguội rồi ướp lạnh."],
o:"Hấp lửa nhỏ và hé nắp để bánh mịn, không bị rỗ."},
{id:5,n:"Trà đào cam sả",c:"Đồ uống",e:"🥤",bg:"#ffcdb2",t:15,lv:"Dễ",r:4.5,k:203,
g:["2 túi trà","1 trái đào ngâm","1 quả cam","2 cây sả","Đường, đá"],
s:["Pha trà với sả đập dập, để nguội.","Cho đào, cam cắt lát vào ly.","Rót trà, thêm đường và đá."],
o:"Ngâm trà không quá 5 phút để tránh bị chát."},
{id:6,n:"Rau muống xào tỏi",c:"Món chay",e:"🥬",bg:"#b6e3a0",t:10,lv:"Dễ",r:4.4,k:77,
g:["1 bó rau muống","5 tép tỏi","Dầu ăn, muối, bột ngọt"],
s:["Nhặt rau, rửa sạch, để ráo.","Phi tỏi thơm với dầu nóng.","Cho rau vào xào lửa lớn 2 phút, nêm nhanh."],
o:"Xào lửa thật lớn và không đậy nắp để rau xanh giòn."}
];
var cat="Tất cả",sort="new",cur=null,star=5,RV={};
try{var s1=localStorage.getItem("zx_rv");if(s1)RV=JSON.parse(s1)||{};var s2=localStorage.getItem("zx_r");if(s2)R=R.concat(JSON.parse(s2)||[])}catch(e){}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function avg(r){var a=RV[r.id]||[];if(!a.length)return{r:r.r,k:r.k};var s=a.reduce(function(x,y){return x+y.s},0);return{r:Math.round((s+r.r*5)/(a.length+5)*10)/10,k:r.k+a.length}}
function imgStyle(r){return r.img?"background-image:url('"+r.img+"')":"background:"+r.bg}
function draw(){
 var q=$("q").value.toLowerCase().trim();
 var l=R.filter(function(r){return(cat=="Tất cả"||r.c==cat)&&(!q||(r.n+" "+r.g.join(" ")+" "+r.s.join(" ")).toLowerCase().indexOf(q)>-1)});
 l.sort(function(a,b){return sort=="rate"?avg(b).r-avg(a).r:sort=="cook"?avg(b).k-avg(a).k:sort=="time"?a.t-b.t:b.id-a.id});
 $("grid").innerHTML=l.length?l.map(function(r){var v=avg(r);
  return '<div class="card" onclick="openR('+r.id+')"><div class="img" style="'+imgStyle(r)+'">'+(r.img?"":r.e)+(r.hot?'<span class="tag">HOT</span>':"")+'</div><div class="cb"><div class="n">'+esc(r.n)+'</div><div class="meta"><span class="star">★ '+v.r+'</span><span>Đã nấu '+v.k+'</span></div><div class="meta"><span class="pr">⏱ '+r.t+' phút</span><span>'+esc(r.lv)+'</span></div></div></div>'}).join(""):'<div class="empty" style="grid-column:1/-1">Không tìm thấy món nào 😢</div>';
}
function drawCats(){
 $("cats").innerHTML=CATS.map(function(c){return '<div class="cat'+(c[1]==cat?" on":"")+'" onclick="setCat(\''+c[1]+'\')"><span>'+c[0]+'</span>'+c[1]+'</div>'}).join("");
 $("f_c").innerHTML=CATS.slice(1).map(function(c){return "<option>"+c[1]+"</option>"}).join("");
}
function setCat(c){cat=c;drawCats();draw()}
document.querySelectorAll(".sort button").forEach(function(b){b.onclick=function(){sort=b.dataset.s;document.querySelectorAll(".sort button").forEach(function(x){x.classList.remove("on")});b.classList.add("on");draw()}});
$("q").addEventListener("input",draw);
function openR(id){
 cur=R.filter(function(r){return r.id==id})[0];star=5;var v=avg(cur);
 $("dt").textContent=cur.n;
 var rv=(RV[id]||[]).slice().reverse().map(function(x){return '<div class="rv"><b>'+esc(x.u)+'</b> <span class="star">'+"★".repeat(x.s)+'</span><br>'+esc(x.t)+'<br><small>'+esc(x.d)+'</small></div>'}).join("")||'<div class="empty">Chưa có đánh giá nào, hãy là người đầu tiên!</div>';
 $("db").innerHTML='<div class="img" style="'+imgStyle(cur)+';aspect-ratio:16/9;border-radius:4px">'+(cur.img?"":cur.e)+'</div>'
 +'<p><span class="star">★ '+v.r+'</span> · Đã nấu '+v.k+' lần · <span class="pr">⏱ '+cur.t+' phút</span> · '+esc(cur.lv)+' · '+esc(cur.c)+'</p>'
 +'<h4>🛒 Nguyên liệu</h4><ul>'+cur.g.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul>'
 +'<h4>👩‍🍳 Cách làm</h4><ol>'+cur.s.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ol>'
 +(cur.o?'<h4>💡 Lưu ý</h4><div class="note">'+esc(cur.o)+'</div>':"")
 +'<h4>⭐ Đánh giá &amp; góp ý</h4><div class="stars" id="stars"></div>'
 +'<input id="u" placeholder="Tên của bạn"><textarea id="t" rows="3" placeholder="Bạn thấy món này thế nào? Góp ý cho Zunxinh nhé..."></textarea><button class="go" onclick="sendRv()">Gửi đánh giá</button><div id="rvs" style="margin-top:12px">'+rv+'</div>';
 drawStars();$("m1").classList.add("on");
}
function drawStars(){$("stars").innerHTML=[1,2,3,4,5].map(function(i){return '<span class="'+(i<=star?"on":"")+'" onclick="star='+i+';drawStars()">★</span>'}).join("")}
function sendRv(){
 var t=$("t").value.trim(),u=$("u").value.trim()||"Ẩn danh";if(!t){$("t").focus();return}
 (RV[cur.id]=RV[cur.id]||[]).push({u:u,t:t,s:star,d:new Date().toLocaleDateString("vi-VN")});
 try{localStorage.setItem("zx_rv",JSON.stringify(RV))}catch(e){}
 openR(cur.id);draw();
}
function openAdd(){$("m2").classList.add("on")}
function closeM(){$("m1").classList.remove("on");$("m2").classList.remove("on")}
function lines(s){return s.split("\n").map(function(x){return x.trim()}).filter(Boolean)}
function addRecipe(){
 var n=$("f_n").value.trim();if(!n){$("f_n").focus();return}
 var rec={id:Date.now(),n:n,c:$("f_c").value,e:"🍽️",bg:"#ffd9a8",t:+$("f_t").value||30,lv:"Dễ",r:5,k:0,g:lines($("f_g").value),s:lines($("f_s").value),o:$("f_o").value.trim()};
 function done(){R.push(rec);try{localStorage.setItem("zx_r",JSON.stringify(R.filter(function(r){return r.id>1e9})))}catch(e){}
  ["f_n","f_g","f_s","f_o","f_i"].forEach(function(i){$(i).value=""});closeM();sort="new";draw()}
 var f=$("f_i").files[0];
 if(f){var fr=new FileReader();fr.onload=function(){rec.img=fr.result;done()};fr.readAsDataURL(f)}else done();
}
[ "m1","m2"].forEach(function(i){$(i).addEventListener("click",function(e){if(e.target==this)closeM()})});
drawCats();draw();
</script>
</body>
</html>
